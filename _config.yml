title: Apicurio Registry
description: 'Open Source Schema and API Registry — a CNCF Sandbox project.'
url: 'https://www.apicur.io'
_baseurl: 'https://www.apicur.io'
github_username: apicurio
github_url: https://github.com/apicurio
github_registry_url: https://github.com/apicurio/apicurio-registry
github_registry_url_2: https://github.com/Apicurio/apicurio-registry/tree/2.6.x
apitomy_url: https://www.apitomy.io
docker_hub_url: https://hub.docker.com/r/apicurio
email: apicurio@lists.cncf.io
future: true
quickstart: true
excerpt_separator: '---'
plugins:
    - jekyll-redirect-from
    - jekyll-sitemap
    - jekyll-feed
    - jekyll-seo-tag
    - jemoji
sass:
    style: compressed
collections:
    docs: {output: true, permalink: '/docs/:path/'}
defaults:
    - {scope: {type: docs}, values: {layout: docs}}
    - {scope: {type: posts}, values: {layout: post, permalink: '/blog/:year/:month/:day/:title'}}
    # A plain path, not a {path, width, height} hash: jekyll-seo-tag 2.6.x emits the hash as
    # "@type": "imageObject" (lowercase), which is invalid schema.org.
    - {scope: {path: ""}, values: {image: /images/opengraph.png}}
    # Generated Maven site pages for every plugin release: thin, near-duplicate content.
    - {scope: {path: "registry/maven-plugin"}, values: {sitemap: false}}
    # A noindex redirect stub generated by Antora; the versioned docs are listed instead.
    - {scope: {path: "registry/docs/index.html"}, values: {sitemap: false}}
exclude:
    - node_modules
    - README.md
    - AGENTS.md
    - Dockerfile
    - _serve.sh
    - _startup.sh
    - project.properties
    - LICENSE.md
    - CNAME
    - Gemfile
    - Gemfile.lock
    - Gruntfile.js
    - package.json
    - script
    - spec
include:
    - _pages
logo: /images/apicurio-logo-square.png
social:
    name: Apicurio Registry
    links:
        - https://github.com/Apicurio/apicurio-registry
        - https://www.cncf.io/projects/apicurio-registry/
        - https://x.com/Apicurio
twitter_username: Apicurio
twitter:
    username: Apicurio
