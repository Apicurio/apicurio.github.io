# Topic hubs ("pillar" pages) that group related blog posts. Rendered by _pages/blog-topics/.
# Page title and description live in the page front matter; `posts` are post URLs, newest first.
security:
  heading: "Securing Apicurio Registry"
  intro: >-
    Apicurio Registry authenticates users and clients with OpenID Connect and supports role-based
    authorization. These posts show how to connect it to specific identity providers and how the
    authentication model has evolved.
  docs: assembly-configuring-registry-security.html
  docs_title: "Configuring Apicurio Registry security"
  posts:
    - /blog/2026/10/19/form-based-authentication
    - /blog/2026/03/26/universal-oauth-with-dex
    - /blog/2026/03/17/openshift-oauth-integration
    - /blog/2026/01/28/registry-external-auth
    - /blog/2024/09/23/registry-azure-entraid-tutorial
    - /blog/2021/05/28/registry-security
migration:
  heading: "Migrating to Apicurio Registry 3.x"
  intro: >-
    Apicurio Registry 3.0 changed the REST API, the configuration properties and the client
    libraries. These posts cover each part of an upgrade, plus moving from Confluent Schema Registry.
  docs: assembly-migrating-registry-v2-v3.html
  docs_title: "Migrating from Apicurio Registry 2.x to 3.x"
  posts:
    - /blog/2025/04/03/evolving-serialization
    - /blog/2025/04/02/application-configuration-migration
    - /blog/2025/03/30/migrate-registry-2-to-3
    - /blog/2025/03/25/registry-30-sdks
    - /blog/2025/03/24/rest-api-changes
    - /blog/2025/03/20/export-from-confluent
    - /blog/2024/06/17/apicurio-registry-3
ai:
  heading: "AI agents, MCP and LLM artifacts"
  intro: >-
    Apicurio Registry applies schema registry governance to AI artifacts: A2A agent cards, MCP tools,
    prompt templates and model schemas. Start with the <a href="/registry/ai/">AI overview</a>, then
    read the posts below.
  docs: assembly-agent-registry-quickstart.html
  docs_title: "Agent registry quick start"
  posts:
    - /blog/2026/02/05/apicurio-registry-ai-natural-evolution
    - /blog/2025/07/08/introducing-mcp-server-for-apicurio-registry-3
    - /blog/2025/05/02/schema-drive-ai-metadata
kafka:
  heading: "Apache Kafka, SerDes and Kafka Connect"
  intro: >-
    Apicurio Registry is most often used as the schema registry for Apache Kafka. These posts cover
    the client serializers and deserializers, Kafka Connect, schema references, and storing the
    registry itself in Kafka.
  docs: assembly-using-kafka-client-serdes.html
  docs_title: "Validating Kafka messages using SerDes"
  posts:
    - /blog/2026/10/31/kafka-connect-protobuf-converter
    - /blog/2025/11/25/registry-dereference-v3
    - /blog/2025/04/03/evolving-serialization
    - /blog/2024/06/21/registry-3-kafkasql
    - /blog/2024/02/08/resolving-a-bug-in-apicurio-registry-kafkasql-storage-upgrade-process
