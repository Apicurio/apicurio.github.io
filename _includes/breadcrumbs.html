{%- comment -%}Visible breadcrumbs matching the BreadcrumbList emitted by structured-data.html.{%- endcomment -%}
{%- if page.breadcrumbs -%}
<ol class="breadcrumb">
    {%- for crumb in page.breadcrumbs %}
    <li><a href="{{ site.baseurl }}{{ crumb.url }}">{{ crumb.name }}</a></li>
    {%- endfor %}
    <li class="active">{{ page.breadcrumb_title | default: page.title }}</li>
</ol>
{%- endif -%}
